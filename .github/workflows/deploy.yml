name: Deploy Vithal Vision

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update production folder
        run: |
          cd /var/www/company-website/vithalvision.in
          git pull origin main

      - name: Install dependencies
        run: |
          cd /var/www/company-website/vithalvision.in
          npm ci

      - name: Build the website
        run: |
          cd /var/www/company-website/vithalvision.in
          npm run build

      - name: Restart the live website
        run: |
          pm2 restart vithal-vision
