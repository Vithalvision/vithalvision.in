name: Vithal Vision CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: vithalvision-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Vithal Vision
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Deploy website
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="/var/www/company-website/vithalvision.in"

          echo "Starting Vithal Vision deployment"

          cd "$PROJECT_DIR"

          echo "Fetching latest code"
          git fetch origin main

          echo "Pulling latest code"
          git pull --ff-only origin main

          echo "Installing dependencies"
          npm ci

          echo "Building production application"
          npm run build

          echo "Restarting PM2 application"
          pm2 restart vithal-vision --update-env

          pm2 save

          echo "Deployment completed successfully"
          pm2 status
